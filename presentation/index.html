<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Red Horizon</title>
<link rel="stylesheet" href="lib/reveal.css">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@700&family=Overpass:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="reveal"><div class="slides">

<!-- 1 TITLE -->
<section data-smoke-fill data-background-image="assets/bg_title.jpg">
  <div class="abs" style="left:90px;top:200px;width:700px">
    <h1 class="big in-left">PROJECT<br>RED<br>HORIZON</h1>
    <p class="in-up d2">SOLMAP, Challenge #14</p>
    <p class="in-up d3">Group members: Annalaya, Anna, Pari,<br>Benonia, Amira, Julia Gorovitz</p>
  </div>
  <img class="abs launcher" src="assets/rocket.png" style="left:1440px;top:20px;height:640px">
  <img class="abs in-right d2" src="assets/flag.png" style="left:1560px;top:300px;height:440px">
  <img class="abs in-up d3" src="assets/astronaut-point.png" style="left:1300px;top:360px;height:580px">
  <img class="abs in-up d4" src="assets/astronaut.png" style="left:1180px;top:480px;height:500px">
</section>

<!-- 2 IMAGINE -->
<section data-background-image="assets/bg_imagine.jpg">
  <img class="abs in-left" src="assets/astronaut.png" style="left:270px;top:260px;height:460px">
  <div class="bubble abs pop d3" style="left:350px;top:140px">???</div>
  <div class="abs right" style="right:150px;top:300px;width:900px">
    <h2 class="huge in-right">Imagine…</h2>
    <p class="in-up d2">You are on a walk, trying to find your way through a new place…</p>
    <p class="in-up d3">Now try again, without using your GPS. No warnings about hazards, no information at all.</p>
  </div>
</section>

<!-- STORY SLIDES (deck pages 18-23) -->
<section data-transition="convex" data-background-color="#000">
  <img class="abs full kb-up" src="assets/launch.jpg" alt="">
</section>

<section data-transition="convex" data-background-color="#000">
  <img class="abs full kb-in" src="assets/control.jpg" alt="">
</section>

<section data-transition="convex" data-background-color="#000">
  <img class="abs full kb-pan" src="assets/plain.jpg" alt="">
</section>

<section data-transition="fade" data-background-color="#000">
  <img class="abs full kb-pan2" src="assets/layers.jpg" alt="">
</section>

<section data-transition="convex" data-background-color="#000">
  <img class="abs full kb-in" src="assets/tracks.jpg" alt="">
</section>

<section data-transition="fade" data-background-color="#000">
  <img class="abs full kb-tube" src="assets/sample.jpg" alt="">
</section>

</div></div>
<canvas id="smoke"></canvas>
<script src="lib/reveal.js"></script>
<script src="main.js"></script>
</body>
</html>
